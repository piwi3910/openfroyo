name: Extended Attributes Management Module
description: Manage extended file attributes (xattr)
version: 1.0.0

variables:
  - name: path
    type: string
    required: true
    description: Path to the file or directory to manage extended attributes

  - name: key
    type: string
    required: true
    description: Extended attribute name (key)

  - name: value
    type: string
    required: false
    description: Extended attribute value (required for state=present)

  - name: state
    type: string
    required: false
    default: present
    description: "Desired state: present or absent"
