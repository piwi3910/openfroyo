name: Block In File Module
description: Insert/update/remove text blocks in files
version: 1.0.0

variables:
  - name: path
    type: string
    required: true
    description: Path to the file to modify

  - name: block
    type: string
    required: false
    description: Text content to insert (required when state=present)

  - name: marker
    type: string
    required: false
    description: Custom marker template with {mark} placeholder (default uses BEGIN/END)

  - name: marker_begin
    type: string
    required: false
    description: Begin marker (overrides marker)

  - name: marker_end
    type: string
    required: false
    description: End marker (overrides marker)

  - name: insertafter
    type: string
    required: false
    description: Insert block after this regex pattern (EOF if not found)

  - name: insertbefore
    type: string
    required: false
    description: Insert block before this regex pattern (BOF if not found)

  - name: state
    type: string
    required: false
    default: present
    description: "Desired state: present or absent"

  - name: create
    type: boolean
    required: false
    default: false
    description: Create file if it doesn't exist

  - name: backup
    type: boolean
    required: false
    default: false
    description: Create backup of original file before modification
