name: Replace Module
description: Replace text in files using regular expressions
version: 1.0.0

variables:
  - name: path
    type: string
    required: true
    description: Path to the file to modify

  - name: regexp
    type: string
    required: true
    description: Regular expression pattern to find

  - name: replace
    type: string
    required: true
    description: Replacement text

  - name: backup
    type: boolean
    required: false
    default: false
    description: Create backup with .bak extension before modifying
