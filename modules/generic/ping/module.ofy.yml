name: ping
version: 1.0.0
description: Test network connectivity using ICMP ping

steps:
  - name: Ping host
    wasm: wasm/ping.wasm
    vars:
      host: "{{ var.host }}"
      count: "{{ var.count | default('4') }}"
      timeout: "{{ var.timeout | default('5') }}"
      interface: "{{ var.interface | default('') }}"
