name: AWS Cloud Management Module
description: Comprehensive AWS cloud management for EC2, S3, VPC, IAM, RDS, Lambda and more
version: 1.0.0

variables:
  # AWS Credentials (optional if using profile or instance roles)
  - name: aws_access_key_id
    type: string
    required: false
    description: AWS Access Key ID (optional if using profile)

  - name: aws_secret_access_key
    type: string
    required: false
    description: AWS Secret Access Key (optional if using profile)

  - name: aws_region
    type: string
    required: false
    default: us-east-1
    description: AWS region for operations

  - name: aws_profile
    type: string
    required: false
    default: default
    description: AWS CLI profile name

  # Command and Operation
  - name: command
    type: string
    required: true
    description: "AWS operation to execute (e.g., create_instance, list_buckets, create_vpc)"

  # EC2 Instance Parameters
  - name: instance_type
    type: string
    required: false
    default: t3.micro
    description: EC2 instance type

  - name: ami_id
    type: string
    required: false
    description: AMI ID for EC2 instance creation

  - name: instance_id
    type: string
    required: false
    description: EC2 instance ID for operations

  - name: instance_ids
    type: array
    required: false
    description: List of EC2 instance IDs for batch operations

  - name: key_name
    type: string
    required: false
    description: SSH key pair name for EC2 instances

  - name: subnet_id
    type: string
    required: false
    description: VPC subnet ID

  - name: security_group_ids
    type: array
    required: false
    description: List of security group IDs

  - name: image_name
    type: string
    required: false
    description: Name for AMI creation

  - name: tag_specifications
    type: object
    required: false
    description: Tags for AWS resources

  # S3 Parameters
  - name: bucket_name
    type: string
    required: false
    description: S3 bucket name

  - name: object_key
    type: string
    required: false
    description: S3 object key (path within bucket)

  - name: local_file
    type: string
    required: false
    description: Local file path for S3 upload/download

  - name: bucket_policy
    type: string
    required: false
    description: S3 bucket policy JSON

  - name: prefix
    type: string
    required: false
    description: S3 object prefix for listing

  # VPC and Networking Parameters
  - name: vpc_id
    type: string
    required: false
    description: VPC ID

  - name: cidr_block
    type: string
    required: false
    description: CIDR block for VPC or subnet

  - name: availability_zone
    type: string
    required: false
    description: Availability zone for subnet

  - name: security_group_name
    type: string
    required: false
    description: Security group name

  - name: security_group_description
    type: string
    required: false
    description: Security group description

  - name: security_group_id
    type: string
    required: false
    description: Security group ID

  - name: ip_protocol
    type: string
    required: false
    default: tcp
    description: IP protocol for security group rules

  - name: from_port
    type: integer
    required: false
    description: Starting port for security group rule

  - name: to_port
    type: integer
    required: false
    description: Ending port for security group rule

  - name: cidr_ip
    type: string
    required: false
    description: CIDR IP range for security group rule

  # IAM Parameters
  - name: user_name
    type: string
    required: false
    description: IAM user name

  - name: role_name
    type: string
    required: false
    description: IAM role name

  - name: policy_arn
    type: string
    required: false
    description: IAM policy ARN

  - name: assume_role_policy_document
    type: string
    required: false
    description: IAM role trust policy document (JSON or file path)

  # RDS Parameters
  - name: db_instance_identifier
    type: string
    required: false
    description: RDS database instance identifier

  - name: db_instance_class
    type: string
    required: false
    default: db.t3.micro
    description: RDS instance class

  - name: engine
    type: string
    required: false
    default: mysql
    description: RDS database engine (mysql, postgres, mariadb, etc.)

  - name: master_username
    type: string
    required: false
    description: RDS master username

  - name: master_password
    type: string
    required: false
    description: RDS master password

  - name: allocated_storage
    type: integer
    required: false
    default: 20
    description: RDS allocated storage in GB

  - name: snapshot_identifier
    type: string
    required: false
    description: RDS snapshot identifier

  # Lambda Parameters
  - name: function_name
    type: string
    required: false
    description: Lambda function name

  - name: runtime
    type: string
    required: false
    default: python3.9
    description: Lambda function runtime

  - name: handler
    type: string
    required: false
    default: index.handler
    description: Lambda function handler

  - name: zip_file
    type: string
    required: false
    description: Path to Lambda function code ZIP file

  - name: lambda_role
    type: string
    required: false
    description: IAM role ARN for Lambda function

  - name: environment_variables
    type: object
    required: false
    description: Environment variables for Lambda function

  - name: payload
    type: string
    required: false
    description: JSON payload for Lambda invocation

  # Additional Parameters
  - name: filters
    type: array
    required: false
    description: Filters for describe operations

  - name: wait
    type: boolean
    required: false
    default: false
    description: Wait for operation to complete

  - name: output_format
    type: string
    required: false
    default: json
    description: AWS CLI output format (json, text, table)
