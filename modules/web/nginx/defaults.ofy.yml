---
# Nginx Module Default Variables

# ==============================================================================
# Service Configuration
# ==============================================================================

# Main Nginx configuration directory
nginx_config_dir: /etc/nginx

# Sites configuration directories (Debian/Ubuntu style)
nginx_sites_available: /etc/nginx/sites-available
nginx_sites_enabled: /etc/nginx/sites-enabled

# Configuration drop-in directory (RHEL/CentOS style)
nginx_conf_d: /etc/nginx/conf.d

# Main configuration file
nginx_main_config: /etc/nginx/nginx.conf

# ==============================================================================
# Operation Settings
# ==============================================================================

# Command to execute (required - no default)
command: ""

# Force operation even if validation fails
force: false

# ==============================================================================
# Server Block Configuration
# ==============================================================================

# Server name(s) - space-separated list
server_name: ""

# Server block configuration file name
server_file: ""

# HTTP listening port
listen_port: 80

# HTTPS listening port
listen_ssl_port: 443

# Document root directory
root: ""

# Index files - space-separated list
index: "index.html index.htm"

# Access log path
access_log: ""

# Error log path
error_log: ""

# ==============================================================================
# SSL/TLS Configuration
# ==============================================================================

# SSL certificate file path
ssl_certificate: ""

# SSL certificate key file path
ssl_certificate_key: ""

# SSL protocols to enable
ssl_protocols: "TLSv1.2 TLSv1.3"

# SSL cipher suites
ssl_ciphers: "HIGH:!aNULL:!MD5"

# Prefer server ciphers over client
ssl_prefer_server_ciphers: "on"

# SSL session cache settings
ssl_session_cache: "shared:SSL:10m"

# SSL session timeout
ssl_session_timeout: "10m"

# Enable HTTP/2
http2: false

# Enable HSTS (HTTP Strict Transport Security)
hsts_enabled: false

# HSTS max age in seconds
hsts_max_age: 31536000

# ==============================================================================
# Upstream Configuration
# ==============================================================================

# Upstream block name
upstream_name: ""

# List of upstream servers (array of "host:port" strings)
upstream_servers: []

# Single upstream server to add/remove
upstream_server: ""

# Load balancing method: round_robin, least_conn, ip_hash, hash, random
load_balance_method: "round_robin"

# Hash key for hash method
hash_key: "$request_uri"

# Keepalive connections to upstream
upstream_keepalive: 32

# ==============================================================================
# Location Block Configuration
# ==============================================================================

# Location path pattern
location_path: "/"

# Location modifier: none, =, ~, ~*, ^~
location_modifier: ""

# Proxy pass URL
proxy_pass: ""

# FastCGI pass socket or address
fastcgi_pass: ""

# Try files directive
try_files: ""

# Alias directive
alias: ""

# ==============================================================================
# Proxy Configuration
# ==============================================================================

# Proxy headers to set
proxy_set_headers:
  - "Host $host"
  - "X-Real-IP $remote_addr"
  - "X-Forwarded-For $proxy_add_x_forwarded_for"
  - "X-Forwarded-Proto $scheme"

# Proxy timeouts
proxy_connect_timeout: "60s"
proxy_send_timeout: "60s"
proxy_read_timeout: "60s"

# Proxy buffering
proxy_buffering: "on"
proxy_buffer_size: "4k"
proxy_buffers: "8 4k"

# ==============================================================================
# FastCGI Configuration
# ==============================================================================

# FastCGI parameters
fastcgi_index: "index.php"
fastcgi_param_script_filename: "$document_root$fastcgi_script_name"

# FastCGI timeouts
fastcgi_connect_timeout: "60s"
fastcgi_send_timeout: "60s"
fastcgi_read_timeout: "60s"

# FastCGI buffering
fastcgi_buffering: "on"
fastcgi_buffer_size: "4k"
fastcgi_buffers: "8 4k"

# ==============================================================================
# Rewrite Rules
# ==============================================================================

# Rewrite regex pattern
rewrite_regex: ""

# Rewrite replacement
rewrite_replacement: ""

# Rewrite flag: last, break, redirect, permanent
rewrite_flag: ""

# ==============================================================================
# Custom Headers
# ==============================================================================

# Header name
header_name: ""

# Header value
header_value: ""

# Header action: add, set, always
header_action: "add"

# ==============================================================================
# Performance Tuning
# ==============================================================================

# Number of worker processes (auto, or number)
worker_processes: "auto"

# Maximum worker connections
worker_connections: 1024

# Multi-accept connections
multi_accept: "on"

# Use epoll on Linux
use_epoll: true

# Client body buffer size
client_body_buffer_size: "128k"

# Client max body size
client_max_body_size: "10m"

# Client header buffer size
client_header_buffer_size: "1k"

# Large client header buffers
large_client_header_buffers: "4 8k"

# Keepalive timeout
keepalive_timeout: 65

# Keepalive requests
keepalive_requests: 100

# Send timeout
send_timeout: "60s"

# Sendfile optimization
sendfile: "on"

# TCP nopush
tcp_nopush: "on"

# TCP nodelay
tcp_nodelay: "on"

# ==============================================================================
# Compression (Gzip)
# ==============================================================================

# Enable gzip compression
gzip_enabled: true

# Gzip compression level (1-9)
gzip_comp_level: 6

# Minimum file size to compress
gzip_min_length: 1000

# Gzip types
gzip_types:
  - "text/plain"
  - "text/css"
  - "text/xml"
  - "text/javascript"
  - "application/json"
  - "application/javascript"
  - "application/xml+rss"
  - "application/xml"

# ==============================================================================
# Caching
# ==============================================================================

# Open file cache max files
open_file_cache_max: 1000

# Open file cache inactive time
open_file_cache_inactive: "20s"

# Open file cache valid time
open_file_cache_valid: "30s"

# Open file cache errors
open_file_cache_errors: "on"

# ==============================================================================
# Rate Limiting
# ==============================================================================

# Rate limit zone name
limit_req_zone_name: ""

# Rate limit zone key
limit_req_zone_key: "$binary_remote_addr"

# Rate limit zone size
limit_req_zone_size: "10m"

# Rate limit rate
limit_req_rate: "10r/s"

# Rate limit burst
limit_req_burst: 20

# Rate limit nodelay
limit_req_nodelay: false

# ==============================================================================
# Security Headers
# ==============================================================================

# X-Frame-Options
x_frame_options: "SAMEORIGIN"

# X-Content-Type-Options
x_content_type_options: "nosniff"

# X-XSS-Protection
x_xss_protection: "1; mode=block"

# Referrer-Policy
referrer_policy: "no-referrer-when-downgrade"

# ==============================================================================
# Additional Configuration
# ==============================================================================

# Additional raw configuration to append
additional_config: ""
