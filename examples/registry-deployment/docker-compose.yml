version: '3.8'

services:
  registry:
    image: golang:1.21-alpine
    container_name: froyo-registry
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./modules:/var/lib/froyo-registry/modules:ro
      - ./data:/var/lib/froyo-registry/data
      - ./logs:/var/log/froyo-registry
      - ./config:/etc/froyo-registry:ro
    environment:
      - REGISTRY_LISTEN=0.0.0.0:8080
      - REGISTRY_MODULES_DIR=/var/lib/froyo-registry/modules
      - REGISTRY_LOG_LEVEL=info
    command: >
      sh -c "
      apk add --no-cache ca-certificates &&
      wget -O /usr/local/bin/froyo-registry https://github.com/piwi3910/openfroyo/releases/download/v1.0.0/froyo-registry-linux-amd64 &&
      chmod +x /usr/local/bin/froyo-registry &&
      /usr/local/bin/froyo-registry --config /etc/froyo-registry/registry.yml
      "
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - froyo-network

networks:
  froyo-network:
    driver: bridge
