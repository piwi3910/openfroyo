---
# Example inventory demonstrating hybrid mode (SSH + Agent)

hosts:
  # SSH mode host (traditional push-based)
  legacy-server:
    mode: ssh
    ssh_host: 192.168.1.100
    ssh_port: 22
    ssh_user: root
    ssh_key_file: ~/.ssh/id_rsa

  # Agent mode host (pull-based with NATS)
  web-01:
    mode: agent
    agent_id: web-01
    datacenter: dc1

  # Agent mode host in different datacenter
  web-02:
    mode: agent
    agent_id: web-02
    datacenter: dc2

  # Another SSH host
  db-server:
    mode: ssh
    ssh_host: 192.168.1.101
    ssh_port: 22
    ssh_user: admin
    ssh_password: secure_password

groups:
  webservers:
    hosts:
      - web-01
      - web-02

  databases:
    hosts:
      - db-server
